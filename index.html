    const total=8+dist+rm+cm+lv+av+itx;

  });

  const slow=(armor?armor.slow||0:0)+(shield?shield.slow||0:0);

function rollDice(expr){
  let tot=0,parts=[];
  (String(expr||"").replace(/\s/g,"").match(/[+-]?[^+-]+/g)||[]).forEach(p=>{
    const sg=p[0]==="-"?-1:1,q=p.replace(/^[+-]/,""),m=q.match(/^(\d*)d(\d+)$/);
    if(m){const n=+m[1]||1,f=+m[2];let s=0,r=[];for(let k=0;k<n;k++){const v=rnd(f);r.push(v);s+=v}tot+=sg*s;parts.push(`${sg<0?"−":""}${n}d${f} [${r.join(", ")}]`)}
    else if(/^\d+$/.test(q)){tot+=sg*(+q);parts.push((sg<0?"−":"+")+q)}
  });
  return {total:tot,txt:parts.join(" ")};
}

function itemRow(e,i){
  const it=itm(e),sl=slotOf(it),canWear=!!(sl||it.bonus),bad=armorOK(it);
  const meta=[];
  if(it.prot&&(it.cat==="armatura"||it.cat==="scudo"||it.cat==="abito"))meta.push("DC +"+it.prot);
  if(it.dmg&&it.cat==="arma")meta.push("danno "+it.dmg);
  if(it.req)meta.push("Forza "+it.req);
  if(sl&&ALL_SLOT[sl])meta.push(ALL_SLOT[sl][0]);
  const im=it.img?`<img class="thumb" src="${it.img}" alt="${esc(it.name)}" loading="lazy" data-lb="${it.img}" data-cap="${esc(it.name)}">`:"";
  const vary=it.vary?`<div class="stepper" style="margin-top:6px"><span class="xs mut">Bonus scelto dal Master</span><button class="sq" data-act="val" data-i="${i}" data-d="-1">−</button><b class="num">${e.val!=null?e.val:it.bonus[it.vary]}</b><button class="sq" data-act="val" data-i="${i}" data-d="1">+</button></div>`:"";
  return `<div class="row">${im}<div class="main"><div class="name">${esc(e.name||it.name)}${e.qty>1?` ×${e.qty}`:""}${e.kit?` <span class="chip">di classe</span>`:""}${it.cursed?` <span class="chip w">maledetto</span>`:""}</div>
    <div class="xs mut">${esc(it.desc||"")}${meta.length?` · ${meta.join(" · ")}`:""}</div>${bad?`<div class="xs" style="color:var(--ember)">${esc(bad)}</div>`:""}${vary}</div>
    <div class="acts" style="flex-direction:column;align-items:flex-end">${canWear&&!bad?`${sw("wear",`data-i="${i}"`,e.on!==false,"Indossato")}<span class="xs mut">${e.on!==false?"indossato":"in zaino"}</span>`:""}
    ${it.cursed&&e.on!==false?"":`<button class="btn sm dng" data-act="${e.qty>1||it.use?"use":"rm"}" data-i="${i}">${e.qty>1||it.use?"Usa 1":"Rimuovi"}</button>`}</div></div>`;

function addItem(id,opt={}){
  const it=ITEMS[id];if(!it)return;
  const ex=S.inv.findIndex(e=>e.id===id);
  if(ex>=0&&it.cursed){S.inv.splice(ex,1);fixEquip();save();render();toast(`${it.name}: la maledizione è spezzata, l'oggetto è rimosso.`);return}
  if(it.cursed&&!opt.confirmed){showSheet(`<h2 style="text-align:center">Oggetto maledetto</h2><p>${esc(it.name)}: una volta preso, non si toglie più. Solo il Master può spezzare la maledizione.</p><div class="grid g2"><button class="btn dng" data-act="addcursed" data-id="${id}">Lo prendo</button><button class="btn sec" data-act="close">Annulla</button></div>`);return}
  if(ex>=0&&!it.cursed&&(it.pub||it.use||it.cat==="oggetto")&&!slotOf(it)){S.inv[ex].qty=(S.inv[ex].qty||1)+1}
  else{
    const e={id,qty:1,on:false};const sl=slotOf(it),bad=armorOK(it);
    if(!bad&&(sl||it.bonus)){e.on=true}
    S.inv.push(e);
  }
  fixEquip();save();render();vib(12);
  const bad=armorOK(it);toast(`${it.name} aggiunto${bad?`. ${bad}`:""}`);
}
function wear(i,on){
  const e=S.inv[i],it=itm(e),sl=slotOf(it);
  if(!on){if(it.cursed){toast("Maledetto: non si toglie.");render();return}e.on=false}
  else{
    const bad=armorOK(it);if(bad){toast(bad);e.on=false;render();return}
    if(sl){
      const lim=(ALL_SLOT[sl]||[sl,1])[1],others=S.inv.filter((x,j)=>j!==i&&x.on!==false&&slotOf(itm(x))===sl);
      if(["armatura","scudo","veste"].includes(sl)){others.forEach(x=>{if(!itm(x).cursed)x.on=false})}
      else if(others.reduce((a,x)=>a+(x.qty||1),0)+(e.qty||1)>lim){toast(`Hai già ${lim} ${(ALL_SLOT[sl]||[])[2]||sl} indossati: togline uno prima.`);render();return}
    }
    e.on=true;
  }
  fixEquip();save();render();
}

  <section class="card"><h2>Promemoria</h2>
   <details open><summary>La DC (Classe di Difficoltà)</summary><div class="body"><p>Il numero che un tiro deve <b>superare</b>. Un totale uguale non basta. <b>20 naturale</b>: sempre un successo. <b>1 naturale</b>: sempre un fallimento. In entrambi i casi il Master decide che cosa succede. Non vale per l'iniziativa. Colpire una creatura ha una DC, la <b>Difficoltà per Colpire</b>: la tua è 8 + armatura + scudo + oggetti.</p></div></details>

   <details><summary>Colpire e danni</summary><div class="body"><p>d20 + bonus a colpire di oggetti e abilità (<b>mai la caratteristica</b>) deve superare la DC per colpire del bersaglio: il pareggio non colpisce. <b>20 naturale</b> colpisce sempre e fa <b>danno doppio</b>; <b>1 naturale</b>: fallimento. Con 20 e con 1 il Master decide che cosa succede. Danno = dado dell'arma + bonus di oggetti e abilità.</p><p><b>Azione di opportunità:</b> se un nemico si allontana dal corpo a corpo, hai un solo tiro per colpirlo. Nel turno dell'avversario non si usano oggetti (eccezione: pergamena di Contromagia).</p></div></details>
   <details><summary>Tratti: Natura, Storia e altri</summary><div class="body"><p>Il Master dice il tratto e la DC; il giocatore tira d20 + modificatore della caratteristica (la migliore se sono due). Se il totale <b>supera la DC</b>, riesce.</p><ul><li><b>Natura</b> · Intelligenza: piante, animali, fenomeni naturali.</li><li><b>Storia</b> · Intelligenza: eventi, persone, culture passate.</li><li><b>Sopravvivenza</b> · Costituzione o Destrezza: cibo, orientamento, ambienti ostili.</li><li><b>Intimidazione</b> · Forza o Carisma: spaventare o persuadere con forza.</li><li><b>Investigazione</b> · Intelligenza: cercare dettagli, dedurre.</li><li><b>Artigianato</b> · Destrezza: creare oggetti, armi, trappole.</li><li><b>Furtività</b> · Destrezza: muoversi senza farsi notare.</li><li><b>Percezione</b>: solo d20, nessun modificatore; decide il Master.</li></ul><p>Bonus: Mezzelfo +1 a qualsiasi prova, Gnomo +1 ai tiri di abilità, Ranger +3 a Natura e Sopravvivenza.</p></div></details>
   <details><summary>Prove e modificatori</summary><div class="body"><p>Prova = d20 + modificatore della caratteristica. Il modificatore è +1 per ogni punto oltre l'8 (per la Costituzione, oltre i PV Base della razza). Un solo d20: niente vantaggio né svantaggio.</p><div class="tw"><table><thead><tr><th>Caratteristica</th><th>Modificatore</th></tr></thead><tbody>${mods}</tbody></table></div></div></details>
   <details><summary>Magia</summary><div class="body"><p>d20 + Intelligenza (Mago) o Carisma (Chierico) deve superare la DC dell'incantesimo; 20 naturale = successo, 1 naturale = fallimento: il Master decide che cosa succede. Non si esauriscono mai. DC per livello:</p><div class="tw"><table><thead><tr><th>Livello</th><th>DC</th></tr></thead><tbody>${dcm}</tbody></table></div></div></details>
   <details><summary>PV, morte e riposi</summary><div class="body"><p>A <b>0 PV</b> il personaggio muore. <b>Riposo lungo:</b> recuperi tutti i PV. <b>Riposo breve:</b> recuperi tanti PV quanti ne hai in quel momento (fino al massimo).</p></div></details>
   <details><summary>Condizioni</summary><div class="body">${CONDS.map(([n,d])=>`<p><b>${n}.</b> ${esc(d)}</p>`).join("")}</div></details>
   <details><summary>Equipaggiamento</summary><div class="body"><p>Il <b>Mago</b> non porta armature, solo l'abito magico (+1 alla DC, fino a +3 con abiti più forti). Il <b>Barbaro</b> non porta armature pesanti. Gli altri portano ogni armatura, se hanno la Forza richiesta. I bonus degli oggetti indossati si sommano. Un oggetto maledetto, una volta indossato, non si toglie.</p></div></details>

noscono le correnti a memoria. Per chi parte, un pilota di Zerilo è una garanzia.","f":["Porto fortificato","Gilda dei piloti","Caserma delle guardie del passaggio","Taverna del Vento Storto"]},{"n":"Castanluim","s":"","x":495,"y":430,"r":"Narvat","t":"Villaggio","d":"Villaggio di crocevia: qui si incontrano le strade che scendono da Utidiana e da Zerilo verso le terre del lago.","k":1,"l":"Villaggio di crocevia: qui si incontrano le strade che scendono da Utidiana e da Zerilo verso le terre del lago. Le carovane si fermano a lasciar riposare i cavalli e a scambiare notizie. Il villaggio ha più stalle che case.","f":["Stazione di posta","Fabbro dei ferri da cavallo","Locanda del Crocevia","Bacheca delle notizie"]},{"n":"Digiaret","s":"","x":195,"y":440,"r":"Narvat","t":"Torre oscura","d":"Torre nera sulla costa, abbandonata da tempo. Chi ci passa vicino racconta di luci alle finestre e di nessuno che risponde.","k":1,"l":"Torre nera sulla costa, abbandonata da tempo. Chi ci passa vicino racconta di luci alle finestre e di nessuno che risponde. Il terreno attorno non ospita erba né uccelli.","f":["Portone di pietra senza maniglia","Scalinata che sale dal mare","Faro spento ai piedi della torre"]},{"n":"Portale di Narvat","s":"Il mistico portale del mondo","x":403,"y":620,"r":"Narvat","t":"Portale","d":"Grande arco di pietra che arde di luce arancione. Gemello di quello di Volgard: si dice che conduca dall'altra parte del mondo. Lo custodiscono gli elfi.","k":1,"l":"Grande arco di pietra che arde di luce arancione. È identico all'altro portale del mondo, a Volgard, e si dice che conduca dall'altra parte del mondo. Si trova sul Lago della cometa. Lo custodiscono gli elfi, che hanno trovato il portale e ne hanno fatto il cuore della loro grande città.","f":["Arco di pietra con rune","Piattaforma dei custodi","Campo di tende dei viaggiatori in attesa"]},{"n":"Iuliantia","s":"","x":470,"y":565,"r":"Narvat","t":"Villaggio elfico","d":"Immensa e bellissima città elfica sulla riva del Lago della cometa. Gli elfi di qui sono i custodi del portale.","k":1,"l":"Immensa e bellissima città elfica sulla riva del Lago della cometa, a un passo dal portale. Gli elfi di qui lo trovarono e lo fecero proprio: ne sono i custodi e si danno il cambio in turni di sette giorni. Gli ospiti sono accolti, ma non possono avvicinarsi al portale senza scorta.","f":["Sala dei custodi","Giardino sul lago","Barche sacre","Casa degli ospiti"]},{"n":"Pontina","s":"","x":355,"y":612,"r":"Narvat","t":"Villaggio","d":"Villaggio di pescatori sul Lago della cometa, subito a ovest del portale.","k":1,"l":"Villaggio di pescatori sul Lago della cometa, subito a ovest del portale. Le barche escono all'alba e tornano con pesci dalle scaglie azzurre che brillano di notte. Il pesce di Pontina è famoso fino a Mormoria.","f":["Molo dei pescatori","Locanda del Pesce Lucente","Mercato dell'alba","Capanne di affumicatura"]},{"n":"Mormoria","s":"","x":490,"y":630,"r":"Narvat","t":"Castello","d":"Il castello più grande di Narvat, circondato da quartieri e botteghe. È il cuore del regno e il mercato principale della regione.","k":1,"l":"Il castello più grande di Narvat, circondato da quartieri e botteghe. È il cuore del regno e il mercato principale della regione. Le sue torri si vedono da tre giorni di cammino e le sue mura hanno più porte che torri.","f":["Castello del re di Narvat","Grande Mercato","Quartiere degli artigiani","Tempio e biblioteca","Caserma della guardia"]},{"n":"Frondalia","s":"","x":375,"y":685,"r":"Narvat","t":"Villaggio elfico","d":"Villaggio tra gli alberi a sud del lago, noto per gli erboristi e per la torre verde che lo domina.","k":1,"l":"Villaggio tra gli alberi a sud del lago, noto per gli erboristi e per la torre verde che lo domina. Gli elfi di Frondalia vendono unguenti, tisane e veleni, e distinguono con cura le tre cose.","f":["Torre verde","Bottega degli erboristi","Giardino delle erbe","Casa dei guaritori"]},{"n":"Incantia","s":"","x":590,"y":695,"r":"Narvat","t":"Villaggio elfico","d":"Borgo sulla costa orientale, casa di incantatori e artigiani di oggetti magici.","k":1,"l":"Borgo sulla costa orientale, casa di incantatori e artigiani di oggetti magici. Nelle botteghe si lavorano bacchette, anelli e lenti che ingrandiscono i sogni. Gli stranieri sono benvenuti, ma tutto si paga.","f":["Bottega delle bacchette","Accademia degli incantatori","Porto dei carichi preziosi","Locanda dell'Ultimo Incantesimo"]},{"n":"Narvol","s":"","x":370,"y":1020,"r":"Narvat","t":"Villaggio","d":"Villaggio ai piedi dei Monti del Biancospino, tappa obbligata per chi scende verso il sud di Narvat.","k":1,"l":"Villaggio ai piedi dei Monti del Biancospino, tappa obbligata per chi scende verso il sud di Narvat. D'inverno la neve chiude il passo e il villaggio si riempie di viandanti bloccati.","f":["Locanda del Biancospino","Stalle e carri","Posto di guardia del passo","Cappella dei viandanti"]},{"n":"Colle vento","s":"Regno di Colle vento","x":240,"y":1180,"r":"Narvat","t":"Castello","d":"Piccolo regno su un altopiano battuto dal vento. Il castello domina i Rifugi di Colle vento, dove i viandanti trovano riparo.","k":1,"l":"Piccolo regno su un altopiano battuto dal vento. Il castello domina i Rifugi di Colle vento, dove i viandanti trovano riparo. Il vento è così costante che gli abitanti lo salutano per nome.","f":["Castello del re","Rifugi dei viandanti","Mulini a vento","Mercato dei mantelli"]},{"n":"Rovine di Haram","s":"","x":470,"y":1465,"r":"Narvat","t":"Rovine","d":"Resti di una città caduta all'estremo sud di Narvat. Tra le mura spezzate resta in piedi solo una torre annerita.","k":1,"l":"Resti di una città caduta all'estremo sud di Narvat. Tra le mura spezzate resta in piedi solo una torre annerita. Nessuno ricorda il motivo della caduta e nessuno vuole accamparsi qui di notte.","f":["Mura spezzate","Torre annerita","Cisterna sotterranea","Strada per la Foresta del vento"]},{"n":"Tuy","s":"La città dei mercanti","x":850,"y":478,"r":"Halvir","t":"Città","d":"Città di commercio sulla costa ovest di Halvir. Qui si compra e si vende di tutto, e le notizie arrivano prima che altrove.","k":1,"l":"Città di commercio sulla costa ovest di Halvir. Qui si compra e si vende di tutto, e le notizie arrivano prima delle navi. Il porto non dorme mai e la dogana è la più lenta, e la più corrotta, della costa.","f":["Porto commerciale","Mercato dei sette banchi","Casa dei mercanti","Dogana","Locande per tutte le tasche"]},{"n":"Ginbad","s":"","x":1058,"y":355,"r":"Halvir","t":"Porta nanica","d":"Porta nanica sul versante nord delle Montagne di Tesk. È gemella di Gunbad, a cui la legano le gallerie sotto la montagna.","k":1,"l":"Porta nanica sul versante nord delle Montagne di Tesk. È gemella di Gunbad, a cui la legano le gallerie sotto la montagna. I nani di Ginbad parlano con quelli di Gunbad con segnali di martello che si sentono per miglia.","f":["Portone nord","Posto di guardia","Mercato del ferro","Imbocco della strada sotterranea"]},{"n":"Gunbad","s":"","x":1257,"y":478,"r":"Halvir","t":"Porta nanica","d":"Porta nanica sul versante sud delle Montagne di Tesk, al centro di Halvir. Fucine e miniere lavorano giorno e notte.","k":1,"l":"Porta nanica sul versante sud delle Montagne di Tesk, al centro di Halvir. Fucine e miniere lavorano giorno e notte, e il fumo si vede a chilometri. Il maggior produttore di armi di Halvir si trova qui.","f":["Fucine di Gunbad","Miniere di Tesk","Sala dei contratti","Armeria dei nani"]},{"n":"Lurgit","s":"","x":882,"y":598,"r":"Halvir","t":"Villaggio","d":"Due borghi vicini lungo il fiume, abitati da contadini e barcaioli.","k":1,"l":"Due borghi vicini lungo il fiume, abitati da contadini e barcaioli. Si fanno la guerra a colpi di scherzi da un secolo, e la festa del fiume è l'unico giorno in cui fanno la pace.","f":["Due mulini rivali","Pontile dei barcaioli","Mercato comune del fiume"]},{"n":"Ruind","s":"","x":790,"y":725,"r":"Halvir","t":"Torre oscura","d":"Torre nera sulla penisola a sud-ovest di Halvir. Nessuno ricorda chi l'abbia costruita.","k":1,"l":"Torre nera sulla penisola a sud-ovest di Halvir. Nessuno ricorda chi l'abbia costruita. Si dice che dall'alto si veda il mare in ogni direzione, anche dove non c'è il mare.","f":["Portone chiuso","Spiaggia di sassi neri","Pozzo al piede della torre"]},{"n":"Spandelyon","s":"Il regno di Baltar","x":965,"y":795,"r":"Halvir","t":"Città araba","d":"Città araba dalle cupole dorate, affacciata sul mare tra palme e sabbia. È il regno di Baltar, il Mago delle Sabbie Arcane. L'onda anomala che si alza davanti alla costa non è naturale: è un'illusione creata da Baltar stesso. Il popolo lo venera, e quando esce dalla sua torre in groppa a un elefante getta monete d'oro alla folla. I bardi ne cantano le lodi.","k":1,"img":[["map/baltar.webp","Baltar, il Mago delle Sabbie Arcane"],["map/erin.webp","Erin, la Barda Errante"]],"l":"Città araba dalle cupole dorate, affacciata sul mare tra palme e sabbia. È il regno di Baltar, il Mago delle Sabbie Arcane. L'onda anomala che si alza davanti alla costa non è naturale: è un'illusione creata da Baltar stesso. Il popolo lo venera, e quando esce dalla sua torre in groppa a un elefante getta monete d'oro alla folla. I bardi ne cantano le lodi.","f":["Torre di Baltar","Grande bazar","Palazzo delle cupole","Porto con l'onda illusoria","Case dei bardi","Il Bazar dei Mestieri, con le botteghe dei mercanti"],"people":[{"n":"Shaira","r":"Veggente","d":"Elfa dalla pelle azzurra, legge il futuro in una bottega buia piena di candele e di teste di cera. Ogni lettura costa una moneta e le sue sfere luminose raramente sbagliano.","i":"shaira"},{"n":"Zimri","r":"Scriba e cambiavalute","d":"Gnomo dal grande turbante e dalla barba bianca. Scrive contratti, lettere e mappe, e conosce le notizie di tutti i mercanti prima che arrivino al porto.","i":"zimri"},{"n":"Borin","r":"Armaiolo","d":"Uomo barbuto dalle mani sicure, forgia e ripara armature e scudi. La sua bottega è piena di elmi e di spade in attesa del padrone.","i":"borin"},{"n":"Zakir","r":"Fabbro","d":"Tiefling dalla pelle rossa, lavora il ferro all'aperto, tra la gente del bazar. Batte sull'incudine con un ritmo che si sente da tutta la piazza.","i":"zakir"},{"n":"Jariq","r":"Mercante di spezie","d":"Uomo-felino dal manto a strisce, vende spezie, resine e profumi con un sorriso furbo. Nessuno ha mai pagato il prezzo che aveva chiesto per primo.","i":"jariq"},{"n":"Raz'kha","r":"Mercante di gemme e spezie","d":"Draconico dalle scaglie scure e dal mantello dorato. Tratta spezie rare e pietre colorate, e parla poco e con precisione.","i":"razkha"},{"n":"Yasmina","r":"Erborista e alchimista","d":"Donna dal velo ricamato, tiene sugli scaffali pozioni colorate e unguenti. È la prima persona a cui si rivolge chi è stato ferito o avvelenato.","i":"yasmina"},{"n":"Narya","r":"Locandiera","d":"Elfa dai lunghi capelli bianchi, gestisce la taverna più affollata di Spandelyon. Ascolta tutto, ricorda tutto e non ripete quasi nulla.","i":"narya"},{"n":"Gorak","r":"Carovaniere","d":"Orco dal turbante e dalla barba nera, guida le carovane di cammelli nel deserto. Più affidabile di quanto sembri: non ha mai perso un carico.","i":"gorak"},{"n":"Lirya","r":"Funambola","d":"Folletta riccia e sorridente che attraversa il bazar camminando su una fune, tra nastri colorati. Il pubblico trattiene il fiato, lei non ha mai paura.","i":"lirya"},{"n":"Gruppo di bardi","r":"Musicisti girovaghi","d":"Suonatori di razze diverse con liuti, tamburi e flauti. Si esibiscono nelle piazze e nelle taverne e cantano le lodi di Baltar.","i":"bardi"}]},{"n":"Zampa Foglia","s":"Il regno dei folletti","x":1320,"y":338,"r":"Halvir","t":"Reame nascosto","d":"Reame di folletti e spiritelli, nascosto in un luogo che sulle mappe non esiste, anche se qui è segnato. Chi non è invitato non lo trova: il sentiero si perde e la radura cambia posto. Le case sono costruite tra i rami di alberi enormi, nel nord di Halvir.","k":1,"l":"Reame di folletti e spiritelli, nascosto in un luogo che sulle mappe non esiste, anche se qui è segnato. Chi non è invitato non lo trova: il sentiero si perde e la radura cambia posto. Le case sono costruite tra i rami di alberi enormi, nel nord di Halvir.","f":["Alberi enormi con le case tra i rami","Sala dei sussurri","Mercato delle cose perdute"]},{"n":"Rudin","s":"","x":1212,"y":690,"r":"Halvir","t":"Villaggio","d":"Villaggio al limite del Bosco tetro, ultima sosta sicura prima della strada per Zerion.","k":1,"l":"Villaggio al limite del Bosco tetro, ultima sosta sicura prima della strada per Zerion. Si dorme con la porta sbarrata e una lanterna accesa tutta la notte.","f":["Locanda Ultima Luce","Palizzata","Posto di guardia"]},{"n":"Emmech","s":"","x":1395,"y":725,"r":"Halvir","t":"Castello","d":"Castello sulla riva del Lago delle stelle. Controlla il passaggio tra Halvir e le terre del sud.","k":1,"l":"Castello sulla riva del Lago delle stelle. Controlla il passaggio tra Halvir e le terre del sud. La Biblioteca Arcana di Emmech è custodita da Azelar, il più antico tra i maghi ancora in vita. Il lago di notte rispecchia le stelle in modo perfetto e per questo il castello ha poche finestre sul lato acqua.","f":["Castello sul lago","Archivio e biblioteca arcana","Porto del lago","Caserma"],"people":[{"n":"Azelar","r":"Custode dei Tomi di Emmech","d":"Mago anziano dalla lunga barba bianca, veglia sulla Biblioteca Arcana tra scaffali altissimi e sfere di luce che gli girano attorno. È uno dei cinque maghi più potenti del mondo e conosce a memoria ogni volume custodito nel castello.","i":"azelar"}]},{"n":"Rovine degli orchi","s":"","x":1543,"y":445,"r":"Halvir","t":"Rovine","d":"Vecchio insediamento degli orchi ai piedi della Foresta di Yuurwod. Qualcuno ci è tornato a vivere.","k":1,"l":"Vecchio insediamento degli orchi ai piedi della Foresta di Yuurwod. Qualcuno ci è tornato a vivere. Le mura sono di pietra grezza e le torri sono segnate con simboli di guerra consumati.","f":["Mura di pietra grezza","Sala del fuoco","Campo di tende nuove tra le rovine"]},{"n":"Koolin","s":"","x":1480,"y":555,"r":"Halvir","t":"Torre oscura","d":"Torre nera su un promontorio del Lago delle stelle. Si vede da lontano, e di notte non ha mai una luce accesa.","k":1,"l":"Torre nera su un promontorio del Lago delle stelle. Si vede da lontano, e di notte non ha mai una luce accesa. Quando il lago è calmo, la torre non si riflette.","f":["Torre nera","Molo senza barche","Sentiero in salita"]},{"n":"Kilson","s":"","x":1113,"y":1065,"r":"Zerion","t":"Villaggio","d":"Villaggio dell'ovest di Zerion, al margine del Bosco del vespro.","k":1,"l":"Villaggio dell'ovest di Zerion, al margine del Bosco del vespro. Vive di legna, miele e cacciagione, e al tramonto le campane suonano per tenere lontano chi cammina nel bosco.","f":["Locanda del Miele","Segheria","Campana del vespro"]},{"n":"Holg","s":"","x":1290,"y":1085,"r":"Zerion","t":"Castello","d":"Castello tra le montagne al centro di Zerion, capitale della regione. Da qui partono le strade per tutte le sue terre.","k":1,"l":"Castello tra le montagne al centro di Zerion, capitale della regione. Da qui partono le strade per tutte le sue terre. Le mura sono scavate nella roccia e il castello sembra una parte della montagna.","f":["Castello di Holg","Piazza delle strade","Mercato di montagna","Casa del consiglio"]},{"n":"Selveen","s":"","x":1432,"y":1123,"r":"Zerion","t":"Villaggio","d":"Villaggio a est di Holg, lungo la strada che porta ai Monti Cervin.","k":1,"l":"Villaggio a est di Holg, lungo la strada che porta ai Monti Cervin. Pastori e cacciatori vi portano pelli e formaggi, e i viandanti vi comprano mantelli pesanti.","f":["Mercato delle pelli","Locanda del Cervo","Recinti dei pastori"]},{"n":"Kilonn","s":"Il reame boscoso","x":1235,"y":1340,"r":"Zerion","t":"Villaggio elfico","d":"Reame nascosto nei boschi del sud di Zerion, raccolto attorno a una torre verde.","k":1,"l":"Reame nascosto nei boschi del sud di Zerion, raccolto attorno a una torre verde. Gli elfi di Kilonn non cacciano e non tagliano alberi: ricevono gli ospiti solo di giorno e li accompagnano fino ai confini.","f":["Torre verde","Sala delle radici","Sentiero degli ospiti"]},{"n":"Powuld","s":"","x":1525,"y":1530,"r":"Zerion","t":"Torre oscura","d":"Torre nera sulla punta meridionale di Zerion, a picco sul mare.","k":1,"l":"Torre nera sulla punta meridionale di Zerion, a picco sul mare. Il vento la fa fischiare di notte, come una voce.","f":["Torre nera sulla scogliera","Sentiero a picco","Cala dei relitti"]},{"n":"Ethelyon","s":"Regno del manto erboso","x":1765,"y":345,"r":"Volgard","t":"Città elfica","d":"Città elfica sul confine tra Halvir e Volgard. I suoi quartieri sono uniti da ponti sospesi tra torri-albero.","k":1,"l":"Città elfica sul confine tra Halvir e Volgard. I suoi quartieri sono uniti da ponti sospesi tra torri-albero. È la città elfica più grande e per tradizione accoglie delegazioni di tutti i regni.","f":["Ponti sospesi","Sala del manto erboso","Quartiere delle delegazioni","Giardino dei cento alberi"]},{"n":"Isangerd","s":"","x":1965,"y":105,"r":"Volgard","t":"Torre oscura","d":"Torre nera sulla costa nord di Volgard, esposta al vento del mare.","k":1,"l":"Torre nera sulla costa nord di Volgard, esposta al vento del mare. Le onde le sbattono addosso con rumore di tamburo.","f":["Torre nera","Scogli aguzzi","Faro spento"]},{"n":"Roccia Ferro","s":"","x":2115,"y":180,"r":"Volgard","t":"Porta nanica","d":"Porta nanica nelle Grandi montagne di Kark. Dalle sue miniere esce il ferro migliore di Volgard.","k":1,"l":"Porta nanica nelle Grandi montagne di Kark. Dalle sue miniere esce il ferro migliore di Volgard. Ogni lingotto porta il marchio di chi l'ha fuso.","f":["Portone di Roccia Ferro","Fonderie","Mercato dei lingotti","Foresteria dei commercianti"]},{"n":"Solid","s":"","x":1905,"y":245,"r":"Volgard","t":"Castello","d":"Castello con il suo borgo ai piedi delle montagne re nera","Molo privato","Segnali di fumo"]},{"n":"Gate del non ritorno","s":"","x":2390,"y":1205,"r":"Isole","t":"Luogo misterioso","d":"Vortice di luce azzurra al centro dell'isola. Nessuno sa dove conduca e nessuno vi è mai entrato.","k":1,"l":"Vortice di luce azzurra al centro dell'isola. Nessuno sa dove conduca: nessuno vi è mai entrato e nessuno lo ha mai attivato, eppure di certo esiste, perché secondo la leggenda qualcuno, molto tempo fa, lo attivò. Il rumore somiglia a una voce che chiama.","f":["Vortice","Rovine del vecchio molo","Statue consumate dal vento"]},{"n":"Isola Caribas","s":"","x":2440,"y":870,"r":"Isole","t":"Isola","d":"Isola a est di Volgard, nel Mare del Tuk.","k":1,"l":"Isola a est di Volgard, nel Mare del Tuk. Spiagge nere, boschi di palme e pochi abitanti che preferiscono non ricevere visite.","f":["Spiaggia nera","Capanne dei pescatori","Sentiero verso l'interno"]},{"n":"Isole tortuose","s":"","x":1810,"y":1575,"r":"Isole","t":"Isole","d":"Gruppo di isole dalle coste frastagliate a sud. I relitti lì attorno dicono quanto sia difficile navigarci.","k":1,"l":"Gruppo di isole dalle coste frastagliate a sud. I relitti lì attorno dicono quanto sia difficile navigarci.","f":["Scogli e secche","Relitti","Grotte marine"]},{"n":"Isole Hawi","s":"","x":125,"y":1480,"r":"Isole","t":"Isole","d":"Catena di isole strette e lunghe a sud-ovest di Narvat.","k":1,"l":"Catena di isole strette e lunghe a sud-ovest di Narvat. Fanno da frangiflutti contro i venti da occidente.","f":["Spiagge lunghe","Villaggi di pescatori","Fari di legno"]},{"n":"Montagne del Farug","s":"","x":410,"y":220,"r":"Narvat","t":"Montagne","d":"Catena al centro del nord di Narvat. Ospita la porta nanica di Utid.","k":2,"l":"Catena al centro del nord di Narvat. Ospita la porta nanica di Utid. Le vette sono bianche tutto l'anno e le valli nascondono miniere abbandonate.","f":[]},{"n":"Foresta delle perle","s":"","x":255,"y":330,"r":"Narvat","t":"Foresta","d":"Foresta tra Alboris e Utid.","k":2,"l":"Foresta tra Alboris e Utid. Le foglie portano gocce d'acqua che brillano come perle all'alba, e gli elfi ne raccolgono la rugiada.","f":[]},{"n":"La foresta fantasma","s":"","x":480,"y":270,"r":"Narvat","t":"Foresta","d":"Foresta fitta a ovest di Zerilo. Il nome viene dalla nebbia che non la lascia mai.","k":2,"l":"Foresta fitta a ovest di Zerilo. La nebbia non la lascia mai, e chi vi entra sente passi alle spalle.","f":[]},{"n":"Lago della cometa","s":"","x":255,"y":570,"r":"Narvat","t":"Lago","d":"Grande lago al centro di Narvat. Sulle sue rive sorgono il portale, Pontina e Iuliantia.","k":2,"l":"Grande lago al centro di Narvat. Si dice che una stella cadente vi si sia spenta e che l'acqua di notte conservi un bagliore.","f":[]},{"n":"Passo della lunga foresta","s":"","x":185,"y":770,"r":"Narvat","t":"Passo","d":"Striscia boscosa lungo la costa ovest, unica via di terra tra il nord e il sud di Narvat.","k":2,"l":"Striscia boscosa lungo la costa ovest, unica via di terra tra il nord e il sud di Narvat. Il bosco è fitto e ci sono banditi.","f":[]},{"n":"Lago di Arum","s":"","x":220,"y":930,"r":"Narvat","t":"Lago","d":"Lago del sud-ovest di Narvat.","k":2,"l":"Lago del sud-ovest di Narvat. Acque scure e ferme, abitate da pesci ciechi.","f":[]},{"n":"Monti del Biancospino","s":"","x":330,"y":950,"r":"Narvat","t":"Montagne","d":"Monti sopra Narvol.","k":2,"l":"Monti sopra Narvol. In primavera i pendii si coprono di fiori bianchi.","f":[]},{"n":"Foresta del vento","s":"","x":395,"y":1310,"r":"Narvat","t":"Foresta","d":"Foresta lungo la strada per le Rovine di Haram.","k":2,"l":"Foresta lungo la strada per le Rovine di Haram. Gli alberi sono piegati dal vento verso un punto preciso.","f":[]},{"n":"Foresta di Cormaantor","s":"","x":920,"y":370,"r":"Halvir","t":"Foresta","d":"Foresta del nord-ovest di Halvir.","k":2,"l":"Foresta del nord-ovest di Halvir. Fitta e silenziosa, con radure antiche.","f":[]},{"n":"Montagne di Tesk","s":"","x":1160,"y":410,"r":"Halvir","t":"Montagne","d":"Catena al centro di Halvir, tra le porte naniche di Ginbad e Gunbad.","k":2,"l":"Catena al centro di Halvir, tra le porte naniche di Ginbad e Gunbad. Sotto passa la strada dei nani.","f":[]},{"n":"Bosco tetro","s":"","x":1300,"y":625,"r":"Halvir","t":"Foresta","d":"Bosco scuro tra Gunbad, Rudin ed Emmech.","k":2,"l":"Bosco scuro tra Gunbad, Rudin ed Emmech. Nessuno ci passa di notte.","f":[]},{"n":"Foresta di Yuurwod","s":"","x":1520,"y":375,"r":"Halvir","t":"Foresta","d":"Foresta che porta verso Ethelyon.","k":2,"l":"Foresta che porta verso Ethelyon. Alberi altissimi e sentieri di caccia degli elfi.","f":[]},{"n":"Lago delle stelle","s":"","x":1515,"y":710,"r":"Halvir","t":"Lago","d":"Grande specchio d'acqua tra Halvir, Zerion e Volgard.","k":2,"l":"Grande specchio d'acqua tra Halvir, Zerion e Volgard. Di notte riflette il cielo in modo perfetto.","f":[]},{"n":"Bosco del vespro","s":"","x":1140,"y":1170,"r":"Zerion","t":"Foresta","d":"Bosco a ovest di Holg.","k":2,"l":"Bosco a ovest di Holg. Al tramonto la luce passa tra i rami in strisce arancioni.","f":[]},{"n":"Monti Cervin","s":"","x":1550,"y":1220,"r":"Zerion","t":"Montagne","d":"Monti a est di Selveen.","k":2,"l":"Monti a est di Selveen. Pascoli alti e ghiacciai.","f":[]},{"n":"Monti del Toerk","s":"","x":1640,"y":930,"r":"Zerion","t":"Montagne","d":"Monti al confine tra Zerion e Volgard.","k":2,"l":"Monti al confine tra Zerion e Volgard. Sono la barriera naturale tra le due regioni.","f":[]},{"n":"Grandi montagne di Kark","s":"","x":2020,"y":300,"r":"Volgard","t":"Montagne","d":"La catena più grande di Volgard, a nord di Minas Runig.","k":2,"l":"La catena più grande di Volgard, a nord di Minas Runig. Le vette bucano le nuvole e le miniere dei nani scendono sotto il livello delle valli.","f":[]},{"n":"Foresta delle mille foglie","s":"","x":2280,"y":280,"r":"Volgard","t":"Foresta","d":"Foresta del nord-est di Volgard.","k":2,"l":"Foresta del nord-est di Volgard. Il fogliame è così fitto di Mormoria, circondato da campi di grano dorato e da tre mulini a vento. Da qui partono ogni mattina i carri che riforniscono il mercato del castello. La gente è semplice e ospitale, e la festa del raccolto richiama visitatori da tutta Narvat.","f":["Campi di grano","Tre mulini a vento","Festa del raccolto"],"x":545,"y":630,"k":1,"sv":1,"pc":"Mormoria"},{"n":"Borgo Lanterna","s":"Il paese delle luci","r":"Narvat","t":"Villaggio","d":"Borgo di lanternai e candelai sulla strada a sud-ovest di Mormoria.","l":"Borgo sulla strada che da Mormoria scende verso il lago. Vi lavorano lanternai e candelai, e di notte le sue vie sono le più illuminate di Narvat. Le sue lanterne si comprano in tutta la regione e si dice che quelle migliori non si spengano nemmeno sotto la pioggia.","f":["Botteghe di lanternai","Strade sempre illuminate","Locanda della Fiamma"],"x":462,"y":677,"k":1,"sv":1,"pc":"Mormoria"},{"n":"Marsa Dhahab","s":"Il porto delle perle","r":"Halvir","t":"Villaggio","d":"Villaggio di pescatori e cercatori di perle sulla costa a est di Spandelyon.","l":"Piccolo villaggio di case bianche sulla costa a est di Spandelyon. I suoi abitanti pescano e si tuffano in cerca di perle, che poi vendono nei bazar della città. Le barche colorate tornano al tramonto, e il villaggio vive al ritmo delle maree.","f":["Barche colorate","Cercatori di perle","Mercato del pesce all'alba"],"x":1020,"y":795,"k":1,"sv":1,"pc":"Spandelyon"},{"n":"Qasr Rimal","s":"L'oasi delle carovane","r":"Halvir","t":"Villaggio","d":"Oasi di carovanieri a nord di Spandelyon, al limite della sabbia.","l":"Oasi di palme e pozzi a nord di Spandelyon, dove si fermano le carovane prima di entrare in città. Tende, cammelli e mercanti di ogni regione si incontrano attorno al grande pozzo. Qui si trovano guide, spezie e notizie da ogni angolo di Halvir.","f":["Grande pozzo","Accampamento delle carovane","Mercato delle spezie"],"x":965,"y":740,"k":1,"sv":1,"pc":"Spandelyon"},{"n":"Molo Grigio","s":"Il porto dei contrabbandieri","r":"Halvir","t":"Villaggio","d":"Piccolo porto di pescatori a sud di Tuy, noto per i contrabbandieri.","l":"Piccolo porto a sud di Tuy, fatto di moli di legno annerito e case strette. Ufficialmente è un villaggio di pescatori, ma tutti sanno che qui arrivano le merci che a Tuy non pagano dazio. Chi cerca un passaggio per mare senza fare domande, viene qui.","f":["Moli di legno nero","Taverna dell'Ancora Storta","Magazzini nascosti"],"x":822,"y":525,"k":1,"sv":1,"pc":"Tuy"},{"n":"Cardolin","s":"Il paese della lana","r":"Halvir","t":"Villaggio","d":"Villaggio di pastori a est di Tuy, sulla strada verso le montagne.","l":"Villaggio di pastori e tessitori a est di Tuy, sulla strada che sale verso le Montagne di Tesk. Le sue greggi danno la lana più morbida di Halvir, e i tessuti di Cardolin si vendono nel mercato di Tuy. La sera i pastori raccontano storie attorno al fuoco.","f":["Greggi sulle colline","Telai dei tessitori","Strada per le montagne"],"x":905,"y":478,"k":1,"sv":1,"pc":"Tuy"},{"n":"Ferraviva","s":"Il villaggio dei minatori","r":"Zerion","t":"Villaggio","d":"Villaggio di minatori e fabbri a est di Holg.","l":"Villaggio di minatori e fabbri sul versante est delle montagne di Holg. Il rumore dei martelli non si ferma mai, e il ferro che esce dalle sue miniere arma i soldati della capitale. Le case sono di pietra scura e i camini fumano giorno e notte.","f":["Miniere di ferro","Forge sempre accese","Case di pietra scura"],"x":1345,"y":1085,"k":1,"sv":1,"pc":"Holg"},{"n":"Pietralba","s":"Il paese del tempio bianco","r":"Zerion","t":"Villaggio","d":"Villaggio di pastori a nord-ovest di Holg, attorno a un piccolo tempio bianco.","l":"Villaggio di pastori a nord-ovest di Holg, raccolto attorno a un piccolo tempio di pietra bianca. I pellegrini vi si fermano prima di salire alla capitale, e i sacerdoti del tempio curano malati e viandanti. È un luogo tranquillo, dove le campane suonano al tramonto.","f":["Tempio di pietra bianca","Pascoli di montagna","Ostello dei pellegrini"],"x":1242,"y":1057,"k":1,"sv":1,"pc":"Holg"},{"n":"Mulino Alto","s":"Il pane della capitale","r":"Volgard","t":"Villaggio","d":"Villaggio di mugnai a nord di Minas Runig, lungo il fiume.","l":"Villaggio di mugnai a nord di Minas Runig, con grandi ruote ad acqua lungo il fiume. Da qui esce la farina che sfama la città più grande del mondo. I mugnai sono gente orgogliosa e ogni anno sfidano i fornai della capitale in una gara di pane.","f":["Ruote ad acqua","Granai fortificati","Gara del pane"],"x":2027,"y":432,"k":1,"sv":1,"pc":"Minas Runig"},{"n":"Guado del Re","s":"Il passaggio a pedaggio","r":"Volgard","t":"Villaggio","d":"Villaggio sul guado a sud di Minas Runig, dove si paga il pedaggio.","l":"Villaggio costruito attorno a un guado sul fiume, a sud di Minas Runig. Chi vuole raggiungere la capitale da sud passa di qui e paga il pedaggio alle guardie del re. Locande, stalle e cambiavalute vivono dei viaggiatori.","f":["Guado sorvegliato","Posto di pedaggio","Locande per viaggiatori"],"x":2055,"y":535,"k":1,"sv":1,"pc":"Minas Runig"},{"n":"Scogliera dei Gabbiani","s":"Il paese sul mare","r":"Volgard","t":"Villaggio","d":"Villaggio di pescatori su una scogliera a sud-est di Polver.","l":"Villaggio di pescatori arrampicato su una scogliera a sud-est di Polver, battuto dal vento del Canale di Surgez. Le barche si calano in mare con funi e carrucole. I suoi marinai sono i più esperti nel leggere le correnti del Mare interno.","f":["Case sulla scogliera","Barche calate con le funi","Piloti del canale"],"x":1867,"y":1347,"k":1,"sv":1,"pc":"Polver"},{"n":"Saline di Polver","s":"Il villaggio del sale","r":"Volgard","t":"Villaggio","d":"Villaggio di salinari a nord-est di Polver, tra vasche bianche.","l":"Villaggio di salinari a nord-est di Polver, tra lunghe vasche di acqua di mare che il sole trasforma in sale. Il sale di Polver conserva il pesce di mezzo mondo e vale quanto l'argento. Al tramonto le vasche diventano rosa.","f":["Vasche del sale","Mucchi di sale bianco","Magazzini del sale"],"x":1887,"y":1272,"k":1,"sv":1,"pc":"Polver"},{"n":"Campo dei Mercenari","s":"Le spade in affitto","r":"Volgard","t":"Accampamento","d":"Accampamento di mercenari a est di Minas Runig, tra tende e recinti per cavalli.","l":"Accampamento di tende e palizzate a est di Minas Runig, dove si radunano mercenari di ogni regione in attesa di un ingaggio. Qui si trovano guerrieri, guide e guardie del corpo, e ogni sera si combatte per gioco attorno ai fuochi. La città li tollera perché, in caso di guerra, sono i primi a essere arruolati.","f":["Tende e palizzate","Recinti per cavalli","Lotte attorno ai fuochi"],"x":2100,"y":480,"k":1,"sv":1,"pc":"Minas Runig"},{"n":"Vignalta","s":"Le vigne della capitale","r":"Volgard","t":"Villaggio","d":"Villaggio di vignaioli sulle colline a nord-est di Minas Runig.","l":"Villaggio di vignaioli sulle colline a nord-est di Minas Runig, tra filari che salgono fino alla cresta. Il suo vino rosso scorre nelle taverne e nei banchetti della capitale. In autunno la vendemmia trasforma il villaggio in una grande festa.","f":["Filari sulle colline","Cantine scavate nella roccia","Festa della vendemmia"],"x":2077,"y":441,"k":1,"sv":1,"pc":"Minas Runig"},{"n":"Pietrafonda","s":"La cava di marmo","r":"Volgard","t":"Villaggio","d":"Villaggio di cavatori a sud-ovest di Minas Runig, da cui viene la pietra delle mura.","l":"Villaggio di cavatori a sud-ovest di Minas Runig. Dalla sua grande cava di marmo bianco è uscita la pietra delle mura della capitale. Gli scalpellini di Pietrafonda sono famosi in tutto il mondo e lavorano per nobili e templi.","f":["Cava di marmo bianco","Botteghe di scalpellini","Statue incompiute"],"x":2026,"y":514,"k":1,"sv":1,"pc":"Minas Runig"},{"n":"Borgo delle Mura","s":"Fuori dalle porte","r":"Volgard","t":"Borgo","d":"Borgo di artigiani e locande fuori dalle mura di Minas Runig.","l":"Borgo cresciuto fuori dalle mura di Minas Runig, dove vive chi non può permettersi una casa in città. Botteghe, locande e mercati notturni lo rendono vivace e un po' pericoloso. Qui si trova di tutto, se si sa a chi chiedere.","f":["Mercato notturno","Locande economiche","Vicoli stretti"],"x":2012,"y":464,"k":1,"sv":1,"pc":"Minas Runig"},{"n":"Tende dei Banu Rih","s":"I figli del vento","r":"Halvir","t":"Accampamento","d":"Accampamento di una tribù nomade del deserto a ovest di Spandelyon.","l":"Accampamento della tribù dei Banu Rih, nomadi del deserto che si spostano con il vento e le stagioni. Allevano cavalli veloci e cammelli, e conoscono ogni pozzo e ogni duna. Sono ospitali con chi rispetta le loro usanze e implacabili con chi le offende.","f":["Grandi tende colorate","Cavalli del deserto","Racconti attorno al fuoco"],"x":922,"y":779,"k":1,"sv":1,"pc":"Spandelyon"},{"n":"Zahra","s":"Il giardino delle rose","r":"Halvir","t":"Villaggio","d":"Villaggio di giardini e palmeti a sud di Spandelyon, famoso per le rose.","l":"Villaggio di giardini e canali d'acqua a sud di Spandelyon, tra palme da dattero e roseti. Le essenze di rosa di Zahra profumano i palazzi della città. Le fontane e l'ombra delle palme ne fanno il luogo preferito dai poeti.","f":["Roseti e palmeti","Canali d'acqua","Distillerie di essenze"],"x":942,"y":833,"k":1,"sv":1,"pc":"Spandelyon"},{"n":"Canneto","s":"Il paese delle canne","r":"Narvat","t":"Villaggio","d":"Villaggio di pescatori tra le canne sulla riva del lago, a ovest di Mormoria.","l":"Villaggio di palafitte tra le canne sulla riva del Lago della cometa. I suoi abitanti pescano, intrecciano cesti e costruiscono barche leggere. Di sera le nebbie del lago avvolgono le case e si sentono solo i richiami degli uccelli.","f":["Case su palafitte","Barche di canna","Nebbie della sera"],"x":447,"y":614,"k":1,"sv":1,"pc":"Mormoria"},{"n":"Quercia Bianca","s":"Il villaggio dei boscaioli","r":"Narvat","t":"Villaggio","d":"Villaggio di boscaioli a sud-est di Mormoria, attorno a un'enorme quercia bianca.","l":"Villaggio di boscaioli raccolto attorno a un'enorme quercia dalla corteccia bianca, che gli abitanti considerano sacra. Il legno che tagliano costruisce le case e le navi di Narvat, ma la quercia non viene mai toccata. Un vecchio druido vive tra le sue radici.","f":["Quercia sacra","Segherie","Capanna del druido"],"x":512,"y":668,"k":1,"sv":1,"pc":"Mormoria"},{"n":"Bivacco dei Cacciatori","s":"La caccia nelle colline","r":"Halvir","t":"Accampamento","d":"Accampamento di cacciatori sulle colline a nord-est di Tuy.","l":"Accampamento di cacciatori e pellicciai sulle colline a nord-est di Tuy. Da qui partono le battute di caccia verso i boschi e le montagne, e le pellicce finiscono nel mercato della città. Chi vuole imparare a seguire una traccia trova qui i migliori maestri.","f":["Capanne di legno","Pelli stese al sole","Cani da caccia"],"x":884,"y":449,"k":1,"sv":1,"pc":"Tuy"},{"n":"Accampamento dei Krag","s":"La tribù della montagna","r":"Zerion","t":"Accampamento","d":"Accampamento di una tribù di montagna a nord di Holg.","l":"Accampamento dei Krag, una tribù di montanari che vive di caccia e di pastorizia tra le vette di Zerion. Commerciano pelli e formaggi con Holg, ma non si sono mai piegati al suo signore. Sono guerrieri fieri e rispettano solo chi li batte in una prova di forza.","f":["Tende di pelle","Totem di pietra","Prove di forza"],"x":1290,"y":1040,"k":1,"sv":1,"pc":"Holg"},{"n":"Approdo dei Naufraghi","s":"Il villaggio dei relitti","r":"Volgard","t":"Villaggio","d":"Villaggio costruito con i relitti delle navi, sulla costa a ovest di Polver.","l":"Villaggio costruito con il legno delle navi naufragate, sulla costa a ovest di Polver. Lo hanno fondato i superstiti di tanti naufragi, e ancora oggi accoglie chi il mare ha risparmiato. Le case hanno la forma di scafi rovesciati e le insegne sono vecchie polene.","f":["Case fatte di scafi","Polene come insegne","Sopravvissuti di ogni terra"],"x":1801,"y":1277,"k":1,"sv":1,"pc":"Polver"},{"n":"Radura del Canto","s":"Il villaggio che canta","r":"Volgard","t":"Villaggio elfico","d":"Villaggio elfico in una radura a ovest di Ethelyon, dove si insegna la musica.","l":"Villaggio elfico in una radura a ovest di Ethelyon, dove le case sono costruite tra i rami. Qui gli elfi insegnano la musica e il canto, e si dice che gli alberi della radura rispondano alle loro melodie. Bardi di ogni razza vengono a studiare qui.","f":["Case tra i rami","Scuola di canto","Alberi che rispondono"],"x":1720,"y":345,"k":1,"sv":1,"pc":"Ethelyon"},{"n":"Ponte d'Argento","s":"Il villaggio di confine","r":"Volgard","t":"Villaggio","d":"Villaggio di confine a sud di Ethelyon, dove elfi e umani commerciano.","l":"Villaggio costruito attorno a un antico ponte dalle pietre argentate, a sud di Ethelyon, sul confine tra Halvir e Volgard. Elfi e umani vi commerciano da secoli e le due lingue si mescolano nelle strade. È un luogo di incontri, accordi e, a volte, di spie.","f":["Ponte d'argento","Mercato di confine","Locanda delle due lingue"],"x":1765,"y":390,"k":1,"sv":1,"pc":"Ethelyon"},{"n":"Riva delle Lucciole","s":"Le notti luminose","r":"Narvat","t":"Villaggio elfico","d":"Piccolo villaggio elfico sulla riva del lago a nord-ovest di Iuliantia.","l":"Piccolo villaggio elfico sulla riva del Lago della cometa, dove d'estate migliaia di lucciole illuminano le notti. Gli elfi di qui raccolgono erbe e preparano pozioni per la grande città. È un luogo di pace, amato da chi cerca riposo.","f":["Lucciole sul lago","Orti di erbe magiche","Case di legno chiaro"],"x":454,"y":522,"k":1,"sv":1,"pc":"Iuliantia"},{"n":"Casale dei Pellegrini","s":"L'ultima sosta prima del portale","r":"Narvat","t":"Borgo","d":"Borgo di locande a est di Iuliantia, dove sostano i pellegrini diretti al portale.","l":"Piccolo borgo di locande e stalle sulla strada per Iuliantia, dove sostano i viaggiatori che vogliono vedere il portale. Gli elfi non lasciano entrare tutti in città, così qui si aspetta il permesso, a volte per settimane. Le locande sono piene di storie e di gente in attesa.","f":["Locande per pellegrini","Stalle","Bacheca dei permessi"],"x":512,"y":580,"k":1,"sv":1,"pc":"Iuliantia"}],"storia":[["Prima dell'albero","Le cronache più antiche dicono che in principio non c'erano terre, ma solo un mare senza fine e un vento che non si fermava mai. Quel vento è ancora oggi il respiro del Mare interno: una corrente forte e ostinata, che soffia sempre nello stesso verso e trascina le navi fuori dalla rotta, anche le più grandi, anche quelle dei piloti più esperti. Chi lascia la costa senza conoscere le sue vie si ritrova spesso dove non voleva andare. Nessuno sa chi abbia mosso per primo quel vento. I vecchi marinai di Polver dicono che sia il fiato del mondo, i maghi di Spandelyon che sia l'eco di un incantesimo mai finito."],["Il seme di Woodpelion","Dal mare, nel punto più lontano da ogni costa, emerse un'isola e su di essa germogliò un seme. Crebbe in secoli, fino a diventare l'albero sacro di Woodpelion: un tronco che si vede da tutte le coste, dalle foglie dorate che al sole brillano come monete. La sua chioma sale oltre le nuvole e sparisce alla vista. Si dice che chi ha attraversato quelle nuvole non sia mai tornato, e che nessuno possa raccontare che cosa ci sia lassù. È il grande mistero del mondo, e resta tale. Per questo l'albero è chiamato il centro del mondo: le terre sono nate attorno a lui, e ogni popolo racconta di essere venuto dalle sue radici."],["L'Era dei portali","Quando le prime terre furono abitate, due archi di pietra si accesero di luce arancione: uno sul Lago della cometa a Narvat, l'altro sulla penisola dell'est, a Volgard. Sono i mistici portali del mondo. Sono identici, e si dice che uno conduca dall'altra parte del mondo. Nessuno ricorda chi li abbia costruiti, ma una sola stirpe li ha sempre custoditi: gli elfi. Da ogni lato sorgono immense e bellissime città elfiche, che hanno trovato il portale e lo hanno fatto proprio. Si racconta che le due città si specchino l'una nell'altra, torre per torre, e che gli elfi dell'una attendano ogni giorno quelli dell'altra. Per un'epoca intera i due popoli si visitarono in un battito. Poi, dicono i custodi di Iuliantia, qualcosa uscì da uno dei due archi che non doveva uscire, e da allora i portali sono sorvegliati e raramente attraversati."],["I nani sotto le montagne","Mentre gli elfi guardavano il cielo, i nani scavavano. Aprirono le porte di Utid nei Monti del Farug, di Ginbad e Gunbad nelle montagne di Tesk, di Roccia Ferro nelle Grandi montagne di Kark, di Erborn a sud di Minas Runig. Le gallerie sotto Tesk uniscono Ginbad a Gunbad: da nord a sud si attraversa la montagna senza vedere il sole. Il ferro di Roccia Ferro è ancora il migliore del mondo e ha armato ogni guerra, anche quelle che i nani non volevano."],["Le torri nere","In un tempo che nessuno sa datare, sulle coste e sui promontori comparvero le torri nere: Digiaret, Ruind, Koolin, Powuld, Isangerd e la torre del Regno del Gate. Non ci sono tracce di chi le costruì né di come: non una cava, non un cantiere. Alcune sono vuote da sempre, altre si accendono di notte. Le cronache dicono soltanto che nessuna torre è stata costruita dopo l'altra, come se fossero comparse tutte insieme."],["Il Gate del non ritorno","Su un'isola del sud-est si apre un vortice di luce azzurra. Prima si chiamava solo il Gate. Nessuno sa dove conduca. Nessuno è mai entrato, nessuno lo ha mai attivato, eppure di certo esiste: la leggenda dice che molto tempo fa qualcuno lo attivò. Si racconta di un viaggiatore senza nome, arrivato sull'isola con un bastone di cristallo, che pronunciò una parola dimenticata davanti alla pietra spenta. Il vortice si aprì, il viaggiatore vi camminò dentro e il vortice non si richiuse più. Da allora l'isola prende il nome del non ritorno: chi ne parla sottovoce dice che il luogo dove porta è anche il luogo da cui è venuto il vento. Una torre nera a nord dell'isola veglia sul vortice, e chi la abita è il Regno del Gate."],["Narvat, il regno dei laghi","Narvat nacque attorno al Lago della cometa, dove una stella cadente (così racconta la gente di Pontina) si spense nell'acqua e lasciò la luce che ancora oggi si vede sulla riva. Il castello di Mormoria, il più grande, crebbe sul mercato del lago e divenne il cuore del regno. A nord, Utidiana costruì la sua rocca attorno a una pietra che di notte emana luce chiara; a est Zerilo fece del suo porto il guardiano del Passaggio del mare interno. A sud Colle vento è un piccolo regno su un altopiano battuto dall'aria, e più giù le Rovine di Haram ricordano una città caduta di cui nessuno vuole più parlare. Gli elfi di Alboris, Frondalia, Incantia e Iuliantia vivono nei boschi, e la Foresta fantasma, con la sua nebbia, è la frontiera che nessun esercito ha mai attraversato."],["Halvir, la terra dei mercanti","Halvir si arricchì perché sta in mezzo. Tuy, la città dei mercanti, sulla costa ovest, vendeva a chiunque e comprava da chiunque; le notizie arrivavano lì prima che altrove. Più a est le montagne di Tesk custodivano le porte naniche, mentre sul Lago delle stelle sorsero Emmech, castello di confine, e la torre nera di Koolin. Sulla costa sud si innalzò Spandelyon, la città araba dalle cupole dorate, che divenne il regno di Baltar. Nella Foresta di Yuurwod, ai piedi del bosco, restano le Rovine degli orchi: un insediamento antico, abbandonato dopo una guerra che gli orchi persero. Si dice che qualcuno sia tornato a viverci."],["Baltar e l'onda di Spandelyon","Baltar è il Mago delle Sabbie Arcane, signore di Spandelyon. Davanti alla sua costa si alza un'onda anomala, alta come una torre, che non si abbatte mai: è un'illusione creata da lui stesso, per mostrare a chi arriva dal mare che il regno è protetto da una magia più antica di qualsiasi flotta. Il popolo lo venera. Quando Baltar esce dalla sua torre, la città si ferma: il mago attraversa le vie in groppa a un elefante e getta monete d'oro alla folla, e la gente le conserva come portafortuna. I bardi della città cantano le sue lodi, e la canzone del «grande Baltar» si sente in ogni mercato di Spandelyon."],["Zerion, il centro-sud","Zerion è la regione più stretta e la più contesa. Holg, il castello tra le montagne, è il suo cuore: da lì partono le strade per Kilson, Selveen e il Bosco del vespro. A sud il reame elfico di Kilonn si nasconde nei boschi attorno a una torre verde, e sulla punta meridionale la torre nera di Powuld guarda il mare. I Monti del Toerk la separano da Volgard; più volte i re di Holg hanno promesso di aprirli con un passo carrabile, e più volte non l'hanno fatto."],["Volgard, la regione dell'est","Volgard è la più vasta. La capitale Minas Runig è la città più grande della mappa: una fortezza a più cerchie di mura, circondata da quartieri. Attorno si allargano i regni: Over, il regno dimenticato, a est, dove le strade principali non passano più; Polin, al margine della Foresta Loree; Polver, il regno del mare, dove si costruiscono le navi che sfidano il vento del Mare interno e dove sorge il Canale di Surgez. A nord le Grandi montagne di Kark e le porte naniche di Roccia Ferro; sul confine con Halvir c'è Ethelyon, la città elfica dei ponti sospesi, e a est il Portale di Volgard con il piccolo regno di Dareel."],["Il Mare interno","Il Mare interno unisce le quattro regioni e le separa. Una corrente forte e un vento costante spingono le navi fuori rotta: per questo ogni porto ha i suoi piloti, che tramandano a voce le correnti, e senza un pilota di Polver o di Zerilo una nave rischia di finire sulle Isole tortuose, dove i relitti segnano la costa, o di perdersi a sud verso il Gate. Le Isole Hawi, lunghe e strette, fanno da frangiflutti a ovest; l'Isola Caribas, nel Mare del Tuk a est, ospita i pochi che non vogliono essere trovati."],["I regni e le casate","Il mondo è fatto di piccoli regni più che di grandi imperi. Colle vento, Dareel, Polin, Polver, Over e Kilonn hanno un loro sovrano e una loro bandiera, ma si rispettano più per interesse che per amicizia: le rotte del mare e le strade dei portali obbligano ognuno a parlare con gli altri."],["I cinque grandi maghi","Si dice che nel mondo vivano cinque maghi più potenti di tutti gli altri. Tre sono noti: Azelar, il Custode dei Tomi di Emmech, il più antico, che veglia sulla Biblioteca Arcana; Itharos, tiefling dalle corna ritorte, signore dei patti e dei cerchi runici; Baltar, il Mago delle Sabbie Arcane, che regna su Spandelyon. Gli altri due non hanno ancora un nome che i viaggiatori conoscano: chi ne parla lo fa sottovoce, e sempre con un nome diverso. Ogni mago domina un frammento del mondo (i libri, i patti, le sabbie) e nessuno obbedisce agli altri."],["Zampa Foglia, il regno che non c'è","Sulla mappa, nel nord di Halvir, è segnato un nome: Zampa Foglia. Chi ci va non trova nulla. Il regno dei folletti e degli spiritelli esiste, ma si nasconde in un luogo che non c'è: il sentiero si perde, la radura cambia posto e gli alberi enormi, con le case tra i rami, si vedono solo da chi è invitato. Il Folletto, una delle razze giocabili, è il solo che sappia ritrovare la strada, perché parla con la natura. Nessun mercante di Tuy ne ha mai visto le porte, ma tutti giurano di aver sentito, di notte, una risata fra i rami."],["Rovine, ombre e misteri","Ovunque, il mondo ricorda più di quanto dica. Le Rovine di Haram, a sud di Narvat, nascondono una torre annerita in mezzo alle mura spezzate. Le Rovine degli orchi sono state occupate da qualcuno che nessuno ha ancora visto in faccia. Digiaret ha luci alle finestre e nessuno che risponde."],["Il Kraken e i vortici","Nell'angolo sud-ovest del mare, dove sulla mappa è disegnato un polpo, si dice che viva una creatura immensa, tanto grande da distruggere le navi, anche quelle da battaglia. I marinai ne parlano a bassa voce: raccontano di vortici nati dal nulla che attirano le navi verso il fondo, di flotte intere sparite e di rari superstiti che non vogliono più parlarne. Nessuno sa dire se il Kraken esista davvero. Chi ha il buon senso di non navigare in quelle acque non lo scoprirà mai."],["Il Cimitero delle Vele","Nel mare in basso a destra, a sud del Gate, si estende una distesa d'acqua piatta e silenziosa chiamata il Cimitero delle Vele. Non ci sono mostri e non c'è tempesta: eppure è pieno di navi affondate. Dicono i marinai di Caribas che le navi entrino con il cielo sereno e non escano più, e che i relitti sul fondo siano migliaia, tutti integri, come se si fossero fermate di colpo. Una sola nave, il «Sospiro di Hawi», è tornata a riva: era vuota, con le vele spiegate e la tavola ancora apparecchiata, e sul registro l'ultima riga diceva soltanto «la bussola gira». Da allora le mappe segnano il Cimitero con un vuoto, e nessun pilota lo attraversa."]],"adv":[],"starts":[{"c":"Mormoria","v":["Spigaverde","Borgo Lanterna","Canneto","Quercia Bianca"]},{"c":"Iuliantia","v":["Riva delle Lucciole","Casale dei Pellegrini"]},{"c":"Tuy","v":["Molo Grigio","Cardolin","Bivacco dei Cacciatori"]},{"c":"Spandelyon","v":["Marsa Dhahab","Qasr Rimal","Tende dei Banu Rih","Zahra"]},{"c":"Holg","v":["Ferraviva","Pietralba","Accampamento dei Krag"]},{"c":"Ethelyon","v":["Radura del Canto","Ponte d'Argento"]},{"c":"Minas Runig","v":["Mulino Alto","Guado del Re","Campo dei Mercenari","Vignalta","Pietrafonda","Borgo delle Mura"]},{"c":"Polver","v":["Scogliera dei Gabbiani","Saline di Polver","Approdo dei Naufraghi"]}]};

  const RACE={"Umano":"umano","Nano":"nano robusto, con barba lunga e intrecciata","Elfo":"elfo con orecchie a punta, lineamenti eleganti e occhi luminosi","Orco":"orco con pelle verde-grigia, zanne e corporatura possente","Halfling":"halfling di piccola statura, con capelli ricci","Tiefling":"tiefling con pelle viola, corna ricurve, occhi dorati e coda","Mezzelfo":"mezzelfo con tratti umani ed elfici, orecchie appena a punta","Gnomo":"gnomo di piccola statura, con occhialoni da inventore","Draconico":"draconico, umanoide con volto a scaglie e corna","Goblin":"goblin con pelle verde, orecchie lunghe e sguardo furbo","Centauro":"centauro, busto umano unito al corpo di un cavallo","Folletto":"folletto minuscolo con ali da libellula"};

  const RW={Umano:["umano","umana","umani"],Nano:["nano","nana","nani"],Elfo:["elfo","elfa","elfi","elfico","elfica"],Orco:["orco","orchessa","orchi","orca"],Halfling:["halfling","hobbit"],Tiefling:["tiefling","demone"],Mezzelfo:["mezzelfo","mezzelfa","mezz'elfo"],Gnomo:["gnomo","gnoma","gnomi"],Draconico:["draconico","draconica","dragonide","drago"],Goblin:["goblin"],Centauro:["centauro","centaura"],Folletto:["folletto","folletta","fata","fatina"]};
  const CW={Guerriero:["guerriero","guerriera"],Ladro:["ladro","ladra","assassino","assassina"],Mago:["mago","maga","strega","stregone"],Chierico:["chierico","chierica","sacerdote","sacerdotessa","prete"],Ranger:["ranger","arciere","arciera"],Barbaro:["barbaro","barbara"],Bardo:["bardo","barda","musicista"]};
  const MW=["maschio","uomo","ragazzo","lui"],FW=["femmina","donna","ragazza","signora","lei"];
  window.lookWarn=function(){const t=" "+(S.look||"").toLowerCase().replace(/[^a-zà-ù']+/g," ")+" ",has=w=>t.includes(" "+w+" ");const out=[];

    for(const[c,ws]of Object.entries(CW))if(c!==S.cls&&ws.some(has)){out.push(`Hai scelto <b>${esc(S.cls)}</b>, ma nella descrizione c'è «${ws.find(has)}»`);break}
    return out.length?`<div class="note bad" id="ptwarn">${out.join(".<br>")}.<br>Il ritratto seguirà le scelte della scheda: cambia la descrizione o torna indietro a cambiare la scelta.</div>`:`<div id="ptwarn"></div>`};
  const upWarn=()=>{const o=document.getElementById("ptwarn");if(o)o.outerHTML=lookWarn()};
  window.portraitSheet=sheet;

  document.addEventListener("click",async e=>{
    const b=e.target.closest("[data-pt]");if(!b)return;const a=b.dataset.pt;
    if(a==="open")sheet(false);
    if(a==="chip"){const l=document.getElementById("ptlook");if(!l)return;let v=l.value.trim();v=(v?v.replace(/,\s*$/,"")+", ":"")+b.dataset.v;l.value=v;S.look=v;save();l.focus();try{l.setSelectionRange(v.length,v.length)}catch(err){}upWarn();return}

    if(a==="app"){const o=document.getElementById("ptout");if(o){try{navigator.clipboard.writeText(o.value)}catch(err){}}return}
    if(a==="copy"){const o=document.getElementById("ptout");if(!o)return;let ok=false;
      try{await navigator.clipboard.writeText(o.value);ok=true}catch(err){}

  });

})();
